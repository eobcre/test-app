<div class="container">
  <h1 class="title">Hospital DB</h1>
  <!-- tabs -->
  <div class="db-details-container">
    <div class="tabs">
      <button
        type="button"
        class="tab"
        [class.active]="activeTab === 'search'"
        (click)="activeTab = 'search'"
      >
        Search
      </button>
      <button
        type="button"
        class="tab"
        [class.active]="activeTab === 'edit'"
        (click)="activeTab = 'edit'"
      >
        Edit
      </button>
    </div>

    @if (activeTab === 'search') {
      <app-search
        (onSearch)="onSearch($event)"
        (onChange)="onInputChange($event)"
        [errorMessage]="errorMessage()"
      ></app-search>
      <app-db-grid [hospitals]="hospitals()" [searchCompleted]="searchCompleted()"></app-db-grid>
      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (onChangePage)="onChangePage($event)"
      ></app-pagination>
      <!-- unused -->
      <!-- <app-search (onChange)="onInputChange($event)"></app-search> -->
    }

    @if (activeTab === 'edit') {
      <app-db-edit [hospitals]="hospitals()" [searchCompleted]="searchCompleted()"></app-db-edit>
      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (onChangePage)="onChangePage($event)"
      ></app-pagination>
    }
  </div>
</div>
